<div id="farm-friend-design" aria-label="小小农场多好友拜访设计 v0.4">
<style>
  #farm-friend-design { --paper:light-dark(#fbf7ec,#29332b); --ink:light-dark(#344c38,#e6ecdc); --muted:light-dark(#6b7866,#bcc8b2); --line:light-dark(#ddd8bf,#52604b); --green:light-dark(#456c4c,#b3c9a3); --on-green:light-dark(#fff9e9,#223321); --soft:light-dark(#e7ecda,#3a4832); font:14px/1.55 "Microsoft YaHei","PingFang SC",sans-serif; color:var(--ink); }

  #farm-friend-design .location small { color:var(--muted); font-size:11px; }
  #farm-friend-design .money { display:flex; align-items:center; gap:7px; color:var(--ink); font-variant-numeric:tabular-nums; }
  #farm-friend-design [data-lucide] { width:17px; height:17px; }
  #farm-friend-design .objects { position:absolute; inset:0; pointer-events:none; }
  #farm-friend-design button, #farm-friend-design select { font:inherit; color:inherit; }
  #farm-friend-design button { background:var(--paper); border:1px solid var(--line); border-radius:8px; padding:8px 12px; min-height:40px; }

  #farm-friend-design .object { position:absolute; pointer-events:auto; transform:translate(-50%,-50%); min-width:44px; min-height:44px; border:0; border-radius:12px; background:transparent; padding:0; }
  #farm-friend-design .object:hover { background:#f0de9530; box-shadow:0 0 16px #fff1ad50; }
  #farm-friend-design .object .obj-label { position:absolute; left:50%; top:calc(100% + 2px); transform:translateX(-50%); background:var(--paper); padding:3px 7px; border-radius:5px; white-space:nowrap; font-size:12px; opacity:0; pointer-events:none; }
  #farm-friend-design .object:hover .obj-label, #farm-friend-design .object:focus-visible .obj-label { opacity:1; }
  #farm-friend-design .bubble { position:absolute; width:20%; max-width:240px; padding:11px 13px; border-radius:12px; background:#fffbea; color:#41543b; border:1px solid #e0d8b8; pointer-events:auto; }
  #farm-friend-design .bubble:after { content:""; position:absolute; bottom:-7px; left:50%; width:12px; height:12px; transform:rotate(45deg); background:#fffbea; border-right:1px solid #e0d8b8; border-bottom:1px solid #e0d8b8; }
  #farm-friend-design .bubble strong { display:flex; justify-content:space-between; align-items:center; gap:6px; font-size:13px; font-weight:500; }
  #farm-friend-design .bubble p { margin:6px 0; font-size:13px; }
  #farm-friend-design .bubble em { display:block; font-size:17px; color:#496d42; font-style:normal; }
  #farm-friend-design .bubble.best { border-color:#7c9865; }
  #farm-friend-design .tag { display:inline-block; font-size:11px; border-radius:4px; padding:1px 4px; color:#4c6340; background:#e6ecd2; }
  #farm-friend-design .bubble.quiet p { display:none; }
  #farm-friend-design .work { position:absolute; z-index:10; width:min(440px,calc(100% - 32px)); padding:18px; background:var(--paper); border:1px solid var(--line); border-radius:13px; box-shadow:0 12px 32px #28351e30; }
  #farm-friend-design .work-head { display:flex; justify-content:space-between; align-items:flex-start; gap:8px; margin-bottom:8px; }

  #farm-friend-design .actions { display:flex; flex-wrap:wrap; gap:8px; }
  #farm-friend-design .actions button { flex:1 1 auto; }
  #farm-friend-design .work select { width:100%; background:var(--paper); border:1px solid var(--line); border-radius:7px; padding:8px; margin:5px 0 12px; min-height:42px; }
  #farm-friend-design .quantity { display:flex; align-items:center; gap:10px; margin:0 0 12px; }

  #farm-friend-design .item-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:5px; margin:12px 0; }

  #farm-friend-design .toast { position:absolute; z-index:20; left:50%; bottom:54px; transform:translateX(-50%); max-width:calc(100% - 32px); width:max-content; border-radius:8px; background:#354d37; color:#fff9e5; padding:10px 16px; font-size:13px; pointer-events:none; }
  @media(max-width:900px) { #farm-friend-design .bubble { padding:8px 10px; } #farm-friend-design .bubble p { font-size:12px; } #farm-friend-design .bubble em { font-size:15px; } }
  @media(max-width:600px) {
    #farm-friend-design .stage { aspect-ratio:auto; height:620px; }
    #farm-friend-design canvas { height:48%; }
    #farm-friend-design .hud { left:10px; right:10px; top:10px; gap:6px; }
    #farm-friend-design .location, #farm-friend-design .money { padding:7px 10px; }
    #farm-friend-design .location strong { font-size:14px; } #farm-friend-design .location small { font-size:11px; }
    #farm-friend-design .object .obj-label { font-size:11px; padding:2px 4px; }
    #farm-friend-design .bubble { width:calc(100% - 28px); max-width:none; left:14px!important; }
    #farm-friend-design .bubble p { margin:3px 0; font-size:12px; } #farm-friend-design .bubble em { font-size:14px; }
    #farm-friend-design .work { padding:14px; } #farm-friend-design .work-head strong { font-size:16px; }
    #farm-friend-design .work select { font-size:16px; } #farm-friend-design .work button { min-height:44px; }
    #farm-friend-design .note { left:14px; bottom:12px; font-size:11px; }
    #farm-friend-design .stage.shop .note { top:82px; bottom:auto; }
  }

  #farm-friend-design .work.book { width:min(720px,calc(100% - 32px)); }
  #farm-friend-design .book .work-head { margin-bottom:3px; }
  #farm-friend-design .book .intro { margin:0 0 12px; font-size:13px; }
  #farm-friend-design .book-search { display:flex; align-items:center; gap:10px; margin-bottom:12px; }
  #farm-friend-design .book-search label { white-space:nowrap; font-size:13px; }
  #farm-friend-design .book-search input { width:100%; min-width:0; min-height:40px; padding:7px 10px; background:var(--paper); border:1px solid var(--line); border-radius:7px; color:var(--ink); font:inherit; font-size:16px; }
  #farm-friend-design .friend-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; }
  #farm-friend-design .friend-entry { display:block; width:100%; text-align:left; padding:9px 11px; background:var(--soft); }
  #farm-friend-design .friend-entry:hover:not(:disabled) { border-color:var(--green); }
  #farm-friend-design .friend-entry:disabled { opacity:.7; }
  #farm-friend-design .friend-entry canvas { position:static; display:block; width:100%; height:64px; }
  #farm-friend-design .friend-name { display:flex; justify-content:space-between; align-items:center; gap:5px; font-weight:500; font-size:14px; }
  #farm-friend-design .friend-name small { font-weight:400; font-size:11px; }
  #farm-friend-design .friend-state { display:block; font-size:12px; margin-top:3px; }
  #farm-friend-design .friend-footer { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:12px; }
  #farm-friend-design .friend-footer output { text-align:center; font-size:12px; font-variant-numeric:tabular-nums; }
  #farm-friend-design .friend-footer button { min-height:40px; padding:6px 10px; }
  #farm-friend-design .friend-empty { grid-column:1/-1; min-height:135px; display:grid; place-items:center; padding:12px; font-size:14px; }
  @media(max-width:760px) { #farm-friend-design .friend-grid { grid-template-columns:repeat(2,minmax(0,1fr)); } }
  @media(max-width:600px) {
    #farm-friend-design .friend-grid { grid-template-columns:1fr; gap:8px; }
    #farm-friend-design .friend-entry { display:grid; grid-template-columns:78px minmax(0,1fr); column-gap:9px; padding:8px 10px; min-height:96px; align-content:center; }
    #farm-friend-design .friend-entry canvas { grid-column:1; grid-row:1/3; height:68px; }
    #farm-friend-design .friend-name { grid-column:2; flex-wrap:wrap; align-self:end; }
    #farm-friend-design .friend-state { grid-column:2; align-self:start; line-height:1.5; }
    #farm-friend-design .friend-footer button { min-height:44px; }
  }

<div class="game"><div class="stage" id="fo-stage">
  <canvas id="fo-art" width="1400" height="735" role="img" aria-label="完整农庄中的店门、石阶、小桥、田地与房子都可以直接点击"></canvas>
  <header class="hud"><div class="location"><strong id="fo-location">我的农场</strong><small>小小农场 · 邻里地址簿 v0.4</small></div><div class="money"><i data-lucide="coins" aria-hidden="true"></i><span id="fo-money">800</span></div></header>
  <div class="objects" id="fo-objects" aria-label="可点击的场景物体"></div>
  <section class="work" id="fo-work" aria-label="所选物体的操作" hidden></section>
  <div class="note" id="fo-note" aria-live="polite">我的农场 · 2 块地成熟</div>
  <div class="toast" id="fo-toast" role="status" hidden></div>
</div></div>
</div>
<script>
(() => {
  const root=document.getElementById('farm-friend-design'),canvas=root.querySelector('#fo-art'),c=canvas.getContext('2d'),stage=root.querySelector('#fo-stage'),objects=root.querySelector('#fo-objects'),work=root.querySelector('#fo-work');
  const saved=window.openai?.widgetState?.privateContent;

const friends=[
  {id:'f1',name:'阿禾',online:true,open:true,roof:'#849b82',shirt:'#a88265',plant:'岩芽菜',welcome:'欢迎来坐坐！我刚把洞里带回的种子种下了。'},
  {id:'f2',name:'小满',online:false,open:true,roof:'#78929e',shirt:'#7c96a5',plant:'白菜',welcome:'我出门啦，院子和小屋都留给你参观。'},
  {id:'f3',name:'小翠',online:true,open:true,roof:'#b38a65',shirt:'#b9a369',plant:'胡萝卜',welcome:'今天的胡萝卜长得特别好，去院子看看吧。'},
  {id:'f4',name:'阿泽',online:true,open:false,roof:'#8c8eaa',shirt:'#87928b',plant:'白菜',welcome:''},
  {id:'f5',name:'阿棉',online:false,open:true,roof:'#a78491',shirt:'#ac8d93',plant:'胡萝卜',welcome:'门口的花刚开，欢迎你来看看。'},
  {id:'f6',name:'阿棠',online:false,open:false,roof:'#bc8e6b',shirt:'#a69372',plant:'岩芽菜',welcome:''},
  {id:'f7',name:'阿岚',online:true,open:true,roof:'#75958b',shirt:'#849e86',plant:'萤果',welcome:'上次探险的纪念品放在展示架上了。'},
  {id:'f8',name:'小朵',online:false,open:true,roof:'#c48e80',shirt:'#b68c78',plant:'白菜',welcome:'欢迎来串门，茶桌旁的窗户能看到小院。'}
];
function host(){return friends.find(f=>f.id===state.visitId)||friends[0];}
function welcome(){return state.visitedOwners[host().id]?'下次也带上你的冒险故事吧。':host().welcome;}
function escapeHtml(t){return String(t).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));}
function pageSize(){const columns=matchMedia('(max-width:600px)').matches?1:matchMedia('(max-width:760px)').matches?2:3;return columns*(stage.clientHeight<570?1:2);}
function directoryData(){const q=state.friendQuery.trim().toLowerCase();let list=friends.filter(f=>f.name.toLowerCase().includes(q));if(!q&&state.lastVisitId)list=list.slice().sort((a,b)=>Number(b.id===state.lastVisitId)-Number(a.id===state.lastVisitId));const size=pageSize(),pages=Math.max(1,Math.ceil(list.length/size));state.friendPage=Math.min(pages-1,Math.max(0,state.friendPage));return {list,size,pages,page:state.friendPage,visible:list.slice(state.friendPage*size,(state.friendPage+1)*size)};}
function directory(){const d=directoryData();return panel('邻里地址簿',`<p class="intro">想去谁家坐坐？点击朋友的家，先到他的院子。</p><div class="book-search"><label for="fo-friend-search">找朋友</label><input id="fo-friend-search" type="search" autocomplete="off" placeholder="输入朋友名字" value="${escapeHtml(state.friendQuery)}"></div><div class="friend-grid" aria-label="朋友的家">${d.visible.length?d.visible.map(f=>`<button type="button" class="friend-entry cursor-interaction" data-action="visit-${f.id}" aria-label="拜访${f.name}，${f.online?'在线':'离线'}，${f.open?'开放参观':'暂未开放'}" ${f.open?'':'disabled'}><canvas width="220" height="100" data-home-preview="${f.id}" role="img" aria-label="${f.name}家的房屋外观"></canvas><span class="friend-name">${f.name}<small>${state.lastVisitId===f.id?'上次拜访':f.open?'去拜访 →':''}</small></span><span class="friend-state">${f.online?'在线':'离线'} · ${f.open?'开放参观':'暂未开放'}</span></button>`).join(''):'<div class="friend-empty" role="status">没有找到这个名字，试试别的名字。</div>'}</div><div class="friend-footer">${button('上一页','friend-prev',false,!d.page)}<output aria-live="polite">${d.page+1} / ${d.pages} 页 · ${d.list.length} 位</output>${button('下一页','friend-next',false,d.page>=d.pages-1)}</div>`);}
function paintPreviews(){work.querySelectorAll('[data-home-preview]').forEach(canvas=>{const f=friends.find(f=>f.id===canvas.dataset.homePreview),ctx=canvas.getContext('2d');ctx.clearRect(0,0,220,100);function p(points,color){ctx.beginPath();points.forEach((a,i)=>i?ctx.lineTo(...a):ctx.moveTo(...a));ctx.closePath();ctx.fillStyle=color;ctx.fill();}function r(x,y,w,h,color){ctx.fillStyle=color;ctx.fillRect(x,y,w,h);}p([[0,79],[64,63],[220,78],[220,100],[0,100]],'#9bb882');p([[81,40],[136,35],[136,89],[81,94]],'#f0dfb4');p([[136,35],[158,47],[158,98],[136,89]],'#c8b994');p([[73,41],[106,12],[167,41],[127,51]],f.roof);p([[73,41],[127,51],[167,41],[167,48],[127,58],[73,48]],'#806b55');r(100,65,20,26,f.open?'#6f7854':'#876c50');r(86,58,10,13,'#89a49b');r(124,55,8,11,'#89a49b');r(150,14,6,24,'#a58b72');p([[57,72],[51,52],[35,45],[19,57],[21,76]],'#718d63');r(35,69,5,20,'#8f7854');r(177,79,12,9,'#a98965');p([[176,79],[180,68],[189,72],[190,79]],'#84a26b');if(!f.open){r(108,74,5,6,'#d4c39b');} });}
function mailbox(){line([[260,338],[260,397]],'#7b6c4d',7);poly([[229,326],[247,308],[282,311],[293,325],[293,354],[229,356]],'#799a9f');poly([[229,326],[247,308],[282,311],[264,327]],'#a8bec0');rect(236,330,43,21,'#dce0c6');line([[236,330],[257,341],[279,330]],'#7f9188',2);line([[290,320],[290,296]],'#846a4d',4);poly([[290,297],[313,296],[313,308],[290,309]],'#c78e70');text('邻里地址簿',261,418,17,'#4b6746');}

  const state={scene:saved?.revision===4&&['farm','shop','camp','explore','battle','home','yard'].includes(saved.scene)?saved.scene:'farm',panel:'',visitId:friends.some(f=>f.id===saved?.visitId)?saved.visitId:'f1',lastVisitId:friends.some(f=>f.id===saved?.lastVisitId)?saved.lastVisitId:'',friendQuery:'',friendPage:0,visitedOwners:{},directorySource:'mailbox',coins:800,kind:'cabbage',quantity:5,inventory:{cabbage:10,carrot:8},harvest:false,planted:false,watered:false,seeds:6,guest:1,visited:false,enemyHp:12,hp:20};
  const design={npcScale:110,dialogue:'短对话常显'};
  const colors={grass:'#93b275',grass2:'#aac68b',grassDark:'#759463',path:'#d0c09a',soil:'#997253',wood:'#8c6648',woodDark:'#624b38',cream:'#f2e2b8',roof:'#b96e51',roofDark:'#91543f',ink:'#40533d'};
  function poly(points,fill,stroke){c.beginPath();points.forEach((p,i)=>i?c.lineTo(...p):c.moveTo(...p));c.closePath();c.fillStyle=fill;c.fill();if(stroke){c.strokeStyle=stroke;c.lineWidth=1;c.stroke();}}
  function ellipse(x,y,rx,ry,fill){c.beginPath();c.ellipse(x,y,rx,ry,0,0,Math.PI*2);c.fillStyle=fill;c.fill();}
  function rect(x,y,w,h,fill){c.fillStyle=fill;c.fillRect(x,y,w,h);}
  function line(points,color,width=2){c.beginPath();points.forEach((p,i)=>i?c.lineTo(...p):c.moveTo(...p));c.strokeStyle=color;c.lineWidth=width;c.lineCap='round';c.lineJoin='round';c.stroke();}
  function text(t,x,y,size=16,color=colors.ink,align='center'){c.fillStyle=color;c.font=`500 ${size}px "Microsoft YaHei", sans-serif`;c.textAlign=align;c.fillText(t,x,y);}
  function cloud(x,y,s){ellipse(x,y,s*1.3,s*.33,'#f5f6daaa');ellipse(x-s*.5,y-s*.15,s*.7,s*.4,'#f5f6daaa');ellipse(x+s*.2,y-s*.24,s*.8,s*.45,'#f5f6daaa');}
  function tree(x,y,s=1,tint='#628354'){ellipse(x,y+5,29*s,12*s,'#4b653128');rect(x-5*s,y-55*s,10*s,60*s,'#846443');poly([[x,y-142*s],[x-39*s,y-105*s],[x-34*s,y-59*s],[x+2*s,y-43*s],[x+37*s,y-75*s],[x+31*s,y-119*s]],tint);poly([[x,y-142*s],[x-39*s,y-105*s],[x,y-92*s],[x+31*s,y-119*s]],'#90aa6d');poly([[x,y-92*s],[x-34*s,y-59*s],[x+2*s,y-43*s],[x+37*s,y-75*s]],'#56784d');}
  function pine(x,y,s=1){ellipse(x,y+4,28*s,9*s,'#405d3325');rect(x-4*s,y-50*s,8*s,53*s,'#79654c');poly([[x,y-151*s],[x-31*s,y-91*s],[x-21*s,y-90*s],[x-43*s,y-48*s],[x+43*s,y-48*s],[x+21*s,y-90*s],[x+31*s,y-91*s]],'#4d7055');poly([[x,y-151*s],[x,y-48*s],[x+43*s,y-48*s],[x+21*s,y-90*s],[x+31*s,y-91*s]],'#385d4b');}
  function rock(x,y,s=1){ellipse(x,y+3,27*s,9*s,'#43543d20');poly([[x-27*s,y],[x-24*s,y-24*s],[x-2*s,y-38*s],[x+28*s,y-19*s],[x+30*s,y+3*s],[x,y+10*s]],'#899084');poly([[x-24*s,y-24*s],[x-2*s,y-38*s],[x+28*s,y-19*s],[x,y-8*s]],'#afb3a0');}

    else if(a==='water'){state.watered=true;state.panel='';toast('已完成本时段浇水');}
    else if(a==='minus'||a==='plus')state.quantity=Math.min(state.inventory[state.kind],Math.max(1,state.quantity+(a==='plus'?1:-1)));
    else if(a==='sell'){if(state.quantity){let paid=price(state.guest),n=state.quantity;state.coins+=paid;state.inventory[state.kind]-=n;state.quantity=Math.min(5,state.inventory[state.kind]);state.panel='';toast(`卖给${guests[state.guest-1][0]} ${n} 个 · +${paid} 金`);}}
    else if(a==='default-sell'){let n=state.inventory[state.kind],paid=Math.round(n*3.4);state.coins+=paid;state.inventory[state.kind]=0;state.quantity=0;state.panel='';toast(`整批 ${n} 个已出售 · +${paid} 金`);}
    else if(a==='buy'){if(state.coins>=20){state.coins-=20;toast('买到白菜种子 ×1 · −20 金');}}
    else if(a==='hello'){state.visited=true;state.visitedOwners[host().id]=true;state.panel='';toast('留下了一句问候 · 交互示意');}
    else if(a==='attack'){state.enemyHp=Math.max(0,state.enemyHp-6);if(!state.enemyHp){goto('explore');return toast('战斗示意结束 · 回到当前探索路线');}}
    else if(a==='end-turn'){state.hp=Math.max(1,state.hp-2);toast('守卫反击 · 生命 −2');}
    else{const replies={care:'这轮已完成照料，详细记录仍在场内打开',seed:'查看仓库中的种子与育种模板',stock:'作物按批次保存在仓库',craft:'制作配方在工坊工作区查看',fertilizer:'货架详情：基础肥料覆盖 2 小时',upgrade:'设施升级前，在委托区查看实际价格与条件',loot:'宝箱内容加入本次背包 · 交互示意',collect:'采集岩芽种子 ×1 · 交互示意'};toast(replies[a]||'场景内操作示意');}
    render();save();
  }
  root.addEventListener('click',e=>{const b=e.target.closest('button');if(b&&!b.disabled&&b.dataset.action)action(b.dataset.action);});
  root.addEventListener('input',e=>{if(e.target.id==='fo-friend-search'){const caret=e.target.selectionStart;state.friendQuery=e.target.value;state.friendPage=0;render();const input=work.querySelector('#fo-friend-search');input.focus({preventScroll:true});try{input.setSelectionRange(caret,caret);}catch{};}});
  root.addEventListener('change',e=>{if(e.target.id==='fo-crop'){state.kind=e.target.value;state.quantity=Math.min(5,state.inventory[state.kind]);render();save();}});
  root.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.panel){state.panel='';render();save();}});
  window.addEventListener('openai:set_globals',event=>{const incoming=event.detail?.globals?.widgetState?.privateContent;if(incoming?.revision===4&&['farm','shop','camp','explore','battle','home','yard'].includes(incoming.scene)&&state.scene!==incoming.scene){state.scene=incoming.scene;if(friends.some(f=>f.id===incoming.visitId))state.visitId=incoming.visitId;if(friends.some(f=>f.id===incoming.lastVisitId))state.lastVisitId=incoming.lastVisitId;state.panel='';render();}});
  let lastWidth=0;new ResizeObserver(()=>{if(stage.clientWidth!==lastWidth){lastWidth=stage.clientWidth;render();}}).observe(stage);
  render();
  if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:render});tweak.addSlider(design,'npcScale',{label:'商店客人大小',min:90,max:125,step:5,unit:'%',reference:'shop.npcScale'});tweak.addSelect(design,'dialogue',{label:'客人对白',options:['短对话常显','选中时展开'],reference:'shop.dialogue'});}
})();
</script>
